name: '2 · Checkov'
# Stage: IaC scan — run alone or via Pipeline
on:
  workflow_call:
  workflow_dispatch:
jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true
          output_format: cli
