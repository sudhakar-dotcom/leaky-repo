name: Checkov IaC Scan
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Checkov Scan
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: .
        quiet: true
        soft_fail: true
        output_format: cli
