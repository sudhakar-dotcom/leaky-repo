name: '1 · Gitleaks'
# Stage: secrets scan — run alone or via Pipeline
# On leaky-repo, findings are EXPECTED. Soft-fail so the Pipeline still produces a full report.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        id: scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: JSON report (detailed)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p safeci-artifacts
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source . --no-git --report-format json --report-path safeci-artifacts/gitleaks-report.json \
            || true
          FINDINGS=0
          if [ -f safeci-artifacts/gitleaks-report.json ]; then
            FINDINGS=$(python3 -c "import json; d=json.load(open('safeci-artifacts/gitleaks-report.json')); print(len(d) if isinstance(d,list) else len(d.get('findings',d.get('Findings',[]))))" 2>/dev/null || echo 0)
          fi
          python3 - <<PY
          import json
          open("safeci-artifacts/stage-meta.json","w",encoding="utf-8").write(json.dumps({
            "stage": "gitleaks",
            "scan_outcome": "${{ steps.scan.outcome }}",
            "status": "success",
            "findings_count": int("${FINDINGS}" or 0),
            "note": "Soft-fail on leaky-repo: secrets findings are expected benchmark fixtures.",
            "where_to_find": "Artifact safeci-gitleaks → gitleaks-report.json; also listed in safeci-full-report.pdf",
          }, indent=2))
          PY
          echo "Gitleaks scan_outcome=${{ steps.scan.outcome }} findings=$FINDINGS (soft-fail; job continues)"
      - name: Upload SafeCI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeci-gitleaks
          path: safeci-artifacts/
          if-no-files-found: warn
