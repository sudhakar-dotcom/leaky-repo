name: '3 · SonarCloud'
# Stage: SAST — run alone or via Pipeline
# Secrets live in the GitHub Environment named "SONAR_TOKEN" (Settings → Environments).
on:
  workflow_call:
  workflow_dispatch:
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    environment: SONAR_TOKEN
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is empty."
            echo "::error::This job uses environment 'SONAR_TOKEN'."
            echo "::error::Add SONAR_TOKEN under Settings → Environments → SONAR_TOKEN → Environment secrets,"
            echo "::error::or add it as a Repository secret and we can drop the environment line."
            echo "::error::https://github.com/sudhakar-dotcom/leaky-repo/settings/environments"
            exit 1
          fi
          echo "SONAR_TOKEN is set (length=${#SONAR_TOKEN})"
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
