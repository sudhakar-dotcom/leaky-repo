name: Pipeline
# Full DevSecOps pipeline — Actions → Pipeline → Run workflow
# Toggle stages below, or open each numbered workflow (1–5) to run one stage alone.
# After all stages, the report job builds one SafeCI full report (summary + artifact).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      run_all:
        description: '▶️ Run ALL stages'
        type: boolean
        default: true
      gitleaks:
        description: '1 — Gitleaks (secrets)'
        type: boolean
        default: false
      checkov:
        description: '2 — Checkov (IaC)'
        type: boolean
        default: false
      sonarcloud:
        description: '3 — SonarCloud (SAST)'
        type: boolean
        default: false
      snyk:
        description: '4 — Snyk (dependencies)'
        type: boolean
        default: false
      zap:
        description: '5 — ZAP (DAST)'
        type: boolean
        default: false
      target_url:
        description: 'DAST target URL (ZAP)'
        type: string
        default: 'https://ginandjuice.shop'

jobs:
  gitleaks:
    name: '1 · Gitleaks'
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_all || inputs.gitleaks }}
    uses: ./.github/workflows/gitleaks.yml
    secrets: inherit

  checkov:
    name: '2 · Checkov'
    needs: [gitleaks]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run_all || inputs.checkov) }}
    uses: ./.github/workflows/checkov.yml
    secrets: inherit

  sonarcloud:
    name: '3 · SonarCloud'
    needs: [checkov]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run_all || inputs.sonarcloud) }}
    uses: ./.github/workflows/sonarqube_cloud.yml
    secrets: inherit

  snyk:
    name: '4 · Snyk'
    needs: [sonarcloud]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run_all || inputs.snyk) }}
    uses: ./.github/workflows/snyk.yml
    secrets: inherit

  zap:
    name: '5 · ZAP'
    needs: [snyk]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run_all || inputs.zap) }}
    permissions:
      contents: read
    uses: ./.github/workflows/zap_baseline.yml
    with:
      target_url: ${{ inputs.target_url || 'https://ginandjuice.shop' }}
    secrets: inherit

  report:
    name: 'SafeCI full report'
    runs-on: ubuntu-latest
    needs: [gitleaks, checkov, sonarcloud, snyk, zap]
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Download stage artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          path: artifacts
          pattern: safeci-*
          merge-multiple: false

      - name: Write stage results JSON
        env:
          GITLEAKS: ${{ needs.gitleaks.result }}
          CHECKOV: ${{ needs.checkov.result }}
          SONARCLOUD: ${{ needs.sonarcloud.result }}
          SNYK: ${{ needs.snyk.result }}
          ZAP: ${{ needs.zap.result }}
        run: |
          python3 - <<'PY'
          import json, os
          results = {
              "gitleaks": os.environ["GITLEAKS"],
              "checkov": os.environ["CHECKOV"],
              "sonarcloud": os.environ["SONARCLOUD"],
              "snyk": os.environ["SNYK"],
              "zap": os.environ["ZAP"],
          }
          open("results.json", "w", encoding="utf-8").write(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2))
          PY

      - name: Show downloaded stage artifacts
        run: |
          echo "Artifacts downloaded for this run:"
          find artifacts -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2 || echo "(none)"

      - name: Generate SafeCI full findings report (PDF)
        env:
          SAFECI_TARGET_URL: ${{ inputs.target_url || 'https://ginandjuice.shop' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -m pip install --quiet xhtml2pdf
          python3 .github/scripts/generate-safeci-report.py \
            --results results.json \
            --artifacts-dir artifacts \
            --pdf safeci-full-report.pdf \
            --html safeci-full-report.html \
            --repository "${{ github.repository }}" \
            --run-url "$RUN_URL" \
            --sha "${{ github.sha }}" \
            --target-url "${SAFECI_TARGET_URL}"
          ls -lh safeci-full-report.*

      - name: Upload full report artifact
        uses: actions/upload-artifact@v6
        with:
          name: safeci-full-report
          path: |
            safeci-full-report.pdf
            safeci-full-report.html
            results.json
          if-no-files-found: error
