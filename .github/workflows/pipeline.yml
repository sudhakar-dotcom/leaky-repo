name: Pipeline
# Full DevSecOps pipeline — Actions → Pipeline → Run workflow
# Toggle stages below, or open each numbered workflow (1–6) to run one stage alone.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      run_all:
        description: '▶️ Run ALL stages'
        type: boolean
        default: true
      gitleaks:
        description: '1 — Gitleaks (secrets)'
        type: boolean
        default: false
      checkov:
        description: '2 — Checkov (IaC)'
        type: boolean
        default: false
      sonarcloud:
        description: '3 — SonarCloud (SAST)'
        type: boolean
        default: false
      snyk:
        description: '4 — Snyk (dependencies)'
        type: boolean
        default: false
      zap:
        description: '5 — ZAP (DAST)'
        type: boolean
        default: false
      dastardly:
        description: '6 — Dastardly (DAST)'
        type: boolean
        default: false
      target_url:
        description: 'DAST target URL (ZAP / Dastardly)'
        type: string
        default: 'https://ginandjuice.shop'

jobs:
  gitleaks:
    name: '1 · Gitleaks'
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_all || inputs.gitleaks }}
    uses: ./.github/workflows/gitleaks.yml
    secrets: inherit

  checkov:
    name: '2 · Checkov'
    needs: [gitleaks]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run_all || inputs.checkov) }}
    uses: ./.github/workflows/checkov.yml
    secrets: inherit

  sonarcloud:
    name: '3 · SonarCloud'
    needs: [checkov]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run_all || inputs.sonarcloud) }}
    uses: ./.github/workflows/sonarqube_cloud.yml
    secrets: inherit

  snyk:
    name: '4 · Snyk'
    needs: [sonarcloud]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run_all || inputs.snyk) }}
    uses: ./.github/workflows/snyk.yml
    secrets: inherit

  zap:
    name: '5 · ZAP'
    needs: [snyk]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run_all || inputs.zap) }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/zap_baseline.yml
    with:
      target_url: ${{ inputs.target_url || 'https://ginandjuice.shop' }}
    secrets: inherit

  dastardly:
    name: '6 · Dastardly'
    needs: [zap]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run_all || inputs.dastardly) }}
    uses: ./.github/workflows/dastardly.yml
    with:
      target_url: ${{ inputs.target_url || 'https://ginandjuice.shop' }}
    secrets: inherit

  summary:
    name: 'Pipeline summary'
    runs-on: ubuntu-latest
    needs: [gitleaks, checkov, sonarcloud, snyk, zap, dastardly]
    if: always()
    steps:
      - name: Print results
        run: |
          echo "## Pipeline Results"
          echo "| Stage | Status |"
          echo "|-------|--------|"
          echo "| 1 Gitleaks | ${{ needs.gitleaks.result }} |"
          echo "| 2 Checkov | ${{ needs.checkov.result }} |"
          echo "| 3 SonarCloud | ${{ needs.sonarcloud.result }} |"
          echo "| 4 Snyk | ${{ needs.snyk.result }} |"
          echo "| 5 ZAP | ${{ needs.zap.result }} |"
          echo "| 6 Dastardly | ${{ needs.dastardly.result }} |"
