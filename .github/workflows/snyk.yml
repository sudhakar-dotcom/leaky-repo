name: '4 · Snyk'
# Stage: dependency scan — run alone or via Pipeline
# Requires repository secret SNYK_TOKEN
#
# leaky-repo now has package.json (SCA demo, modeled on iitk_cscd_project).
# `snyk test` → CI JSON report; `snyk monitor` → Project on https://app.snyk.io
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare artifact dir
        run: mkdir -p safeci-artifacts

      - name: Check SNYK_TOKEN
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning::SNYK_TOKEN repository secret is missing — dependency stage will be skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Root .npmrc is a planted secrets fixture (always-auth) and breaks npm/Snyk.
      - name: Neutralize fixture .npmrc for Snyk
        if: steps.token.outputs.present == 'true'
        run: |
          if [ -f .npmrc ]; then
            mv .npmrc .npmrc.gitleaks-fixture.bak
            echo "Moved fixture .npmrc aside for Snyk (restored after scan)."
          fi

      - name: Detect package.json
        id: manifests
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using package.json for Snyk (same pattern as iitk_cscd_project)."
            python3 -c "import json; d=json.load(open('package.json')); print('name=', d.get('name')); print('deps=', list((d.get('dependencies') or {}).keys()))"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json found."
          fi

      # Snyk Open Source needs installed deps (same as iitk after npm install).
      - name: Setup Node and install dependencies
        if: steps.token.outputs.present == 'true' && steps.manifests.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm install
        if: steps.token.outputs.present == 'true' && steps.manifests.outputs.found == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Snyk test (CI report)
        id: test
        if: steps.token.outputs.present == 'true' && steps.manifests.outputs.found == 'true'
        uses: snyk/actions/node@v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=package.json --severity-threshold=high --json-file-output=safeci-artifacts/snyk-report.json

      - name: Snyk monitor (create/update Project on Snyk website)
        id: monitor
        if: steps.token.outputs.present == 'true' && steps.manifests.outputs.found == 'true'
        uses: snyk/actions/node@v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --file=package.json

      - name: Restore fixture .npmrc
        if: always()
        run: |
          if [ -f .npmrc.gitleaks-fixture.bak ]; then
            mv .npmrc.gitleaks-fixture.bak .npmrc
          fi

      - name: Stage meta
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          TOKEN_PRESENT: ${{ steps.token.outputs.present }}
          MANIFESTS: ${{ steps.manifests.outputs.found }}
        run: |
          mkdir -p safeci-artifacts
          sudo chmod -R a+rX safeci-artifacts 2>/dev/null || true
          python3 - <<'PY'
          import json, os, pathlib
          report = pathlib.Path("safeci-artifacts/snyk-report.json")
          token = os.environ.get("TOKEN_PRESENT") == "true"
          manifests = os.environ.get("MANIFESTS") == "true"
          test_out = os.environ.get("TEST_OUTCOME") or "skipped"
          mon_out = os.environ.get("MONITOR_OUTCOME") or "skipped"
          count = 0
          if report.exists():
              try:
                  data = json.loads(report.read_text(encoding="utf-8", errors="replace"))
                  for proj in (data if isinstance(data, list) else [data]):
                      count += len((proj or {}).get("vulnerabilities") or [])
              except Exception as exc:
                  print(f"could not parse snyk-report.json: {exc}")
          if not token:
              note = "Skipped: SNYK_TOKEN repository secret is not configured."
              status = "skipped"
          elif not manifests:
              note = "No package.json found."
              status = "skipped"
          else:
              note = (
                  f"test={test_out}, monitor={mon_out}. "
                  "Open https://app.snyk.io → Projects for leaky-repo-snyk-demo after monitor succeeds."
              )
              status = test_out
          pathlib.Path("safeci-artifacts/stage-meta.json").write_text(json.dumps({
              "stage": "snyk",
              "status": status,
              "findings_count": count,
              "note": note,
              "dashboard": "https://app.snyk.io",
              "where_to_find": (
                  "https://app.snyk.io → Projects (after monitor) · "
                  "CI: artifact safeci-snyk -> snyk-report.json"
              ),
          }, indent=2), encoding="utf-8")
          print(note)
          print(f"Snyk vulnerabilities={count} report_present={report.exists()}")
          PY

      - name: Upload SafeCI artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: safeci-snyk
          path: safeci-artifacts/
          if-no-files-found: warn
