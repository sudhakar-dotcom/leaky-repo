name: '4 · Snyk'
# Stage: dependency scan — run alone or via Pipeline
# Requires repository secret SNYK_TOKEN
# Note: this secrets-benchmark repo has no package.json; continue-on-error keeps the stage green.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare artifact dir
        run: mkdir -p safeci-artifacts
      - name: Check SNYK_TOKEN
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning::SNYK_TOKEN repository secret is missing — dependency stage will be skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Snyk to check for vulnerabilities
        id: scan
        if: steps.token.outputs.present == 'true'
        uses: snyk/actions/node@v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high --json-file-output=safeci-artifacts/snyk-report.json
      - name: Stage meta
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          TOKEN_PRESENT: ${{ steps.token.outputs.present }}
        run: |
          mkdir -p safeci-artifacts
          sudo chmod -R a+rX safeci-artifacts 2>/dev/null || true
          python3 - <<'PY'
          import json, os, pathlib
          report = pathlib.Path("safeci-artifacts/snyk-report.json")
          token = os.environ.get("TOKEN_PRESENT") == "true"
          outcome = os.environ.get("SCAN_OUTCOME") or "skipped"
          count = 0
          if report.exists():
              try:
                  data = json.loads(report.read_text(encoding="utf-8", errors="replace"))
                  for proj in (data if isinstance(data, list) else [data]):
                      count += len((proj or {}).get("vulnerabilities") or [])
              except Exception as exc:
                  print(f"could not parse snyk-report.json: {exc}")
          if not token:
              note = "Skipped: SNYK_TOKEN repository secret is not configured."
          elif not report.exists():
              note = ("No dependency manifests found (leaky-repo is a secrets benchmark, "
                      "not an app), so Snyk produced no report.")
          else:
              note = "Dependency scan completed at --severity-threshold=high."
          pathlib.Path("safeci-artifacts/stage-meta.json").write_text(json.dumps({
              "stage": "snyk",
              "status": outcome if token else "skipped",
              "findings_count": count,
              "note": note,
              "dashboard": "https://app.snyk.io",
              "where_to_find": "Artifact safeci-snyk -> snyk-report.json; also https://app.snyk.io",
          }, indent=2), encoding="utf-8")
          print(f"Snyk vulnerabilities={count} report_present={report.exists()}")
          PY
      - name: Upload SafeCI artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: safeci-snyk
          path: safeci-artifacts/
          if-no-files-found: warn
