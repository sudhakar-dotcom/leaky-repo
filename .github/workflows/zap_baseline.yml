name: '5 · ZAP'
# Stage: DAST baseline — run alone or via Pipeline
on:
  workflow_call:
    inputs:
      target_url:
        description: 'URL of the application to scan'
        type: string
        required: false
        default: 'https://ginandjuice.shop'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL of the application to scan'
        type: string
        required: false
        default: 'https://ginandjuice.shop'
jobs:
  zap_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    name: zap
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: ${{ inputs.target_url || 'https://ginandjuice.shop' }}
          fail_action: false
