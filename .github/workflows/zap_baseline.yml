name: '5 · ZAP'
# Stage: DAST baseline — run alone or via Pipeline
# Issues are disabled on this repo, so the action must not try to open GitHub issues.
on:
  workflow_call:
    inputs:
      target_url:
        description: 'URL of the application to scan'
        type: string
        required: false
        default: 'https://ginandjuice.shop'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL of the application to scan'
        type: string
        required: false
        default: 'https://ginandjuice.shop'
jobs:
  zap_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: zap
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: ZAP Scan
        id: scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: ${{ inputs.target_url || 'https://ginandjuice.shop' }}
          fail_action: false
          allow_issue_writing: false
      - name: Collect ZAP reports
        if: always()
        run: |
          mkdir -p safeci-artifacts
          for f in report_html.html report_md.md report_json.json zap.yaml; do
            [ -f "$f" ] && cp "$f" safeci-artifacts/ || true
          done
          # action may write under different names — scoop common patterns
          find . -maxdepth 2 -type f \( -iname '*zap*' -o -iname 'report_*.html' -o -iname 'report_*.md' -o -iname 'report_*.json' \) \
            ! -path './safeci-artifacts/*' -exec cp -n {} safeci-artifacts/ \; 2>/dev/null || true
          printf '%s\n' "{\"stage\":\"zap\",\"status\":\"${{ steps.scan.outcome }}\",\"target_url\":\"${{ inputs.target_url || 'https://ginandjuice.shop' }}\"}" \
            > safeci-artifacts/stage-meta.json
          ls -la safeci-artifacts || true
      - name: Upload SafeCI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeci-zap
          path: safeci-artifacts/
          if-no-files-found: warn
