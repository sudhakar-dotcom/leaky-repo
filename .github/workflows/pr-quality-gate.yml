name: PR Quality Gate
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Snyk Dependency Check
        uses: snyk/actions/node@v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.qualitygate.wait=true

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true
          output_format: cli

  comment:
    runs-on: ubuntu-latest
    needs: [gitleaks, snyk, sonarqube, checkov]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Post Results Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## PR Quality Gate Results

            | Check | Status |
            |-------|--------|
            | **Gitleaks** (Secrets) | ${{ needs.gitleaks.result == 'success' && '✅ Pass' || '❌ Fail' }} |
            | **Snyk** (Dependencies) | ${{ needs.snyk.result == 'success' && '✅ Pass' || '❌ Fail' }} |
            | **SonarCloud** (Code Quality) | ${{ needs.sonarqube.result == 'success' && '✅ Pass' || '❌ Fail' }} |
            | **Checkov** (IaC) | ${{ needs.checkov.result == 'success' && '✅ Pass' || '❌ Fail' }} |
